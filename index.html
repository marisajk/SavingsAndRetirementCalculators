<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retirement Calculators</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div>
        <h1>Your Retirement Planning</h1>
        <div class="tiny">All math runs locally in the browser. Numbers aren’t saved.</div>
      </div>
      <div class="pill">End-of-period contributions</div>
    </div>

    <h2>Savings Phase (Growth Before Retirement)</h2>
    <div id="grid-blue" class="grid"></div>

    <h2>Retirement Phase (Withdrawals During Retirement)</h2>
    <div id="grid-green" class="grid"></div>

    <div style="margin-top:12px">
      <button id="reset">Reset all to empty</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
